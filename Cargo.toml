[workspace]
members = ["crates/*"]
default-members = ["crates/formalith", "crates/formalith-session", "crates/formalith-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/supersurviveur/formalith"
license-file = "LICENSE"

[workspace.dependencies]
formalith = { path = "crates/formalith" }
formalith-session = { path = "crates/formalith-session" }

# The wasm builds (`./dev web --release`, `./dev gui-web --release`): small binaries, native builds keep `release`
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
