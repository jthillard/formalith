[package]
name = "formalith"
description = "Modern computer algebra system focused on flexibility"
version = "0.1.0"
edition = "2024"
default-run = "formalith"
repository = "https://github.com/supersurviveur/formalith"
license-file = "LICENSE"
readme = "README.md"
keywords = ["mathematics", "symbolic", "algebra"]
categories = ["Mathematics", "Science"]

[dependencies]
append-only-vec = "0.1"
dyn-clone = "1"
dyn-eq = "0.1"
dyn-hash = "1"
malachite = { version = "0.9", default-features = false, features = ["naturals_and_integers", "rationals"] }
owo-colors = "4"
supports-color = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
rustyline = { version = "19.0.0", default-features = false, optional = true }

# [profile.release]
# debug = 1

[features]
default = ["cli"]
concise-debug = []
cli = ["dep:rustyline"]

[[bin]]
name = "cli"
required-features = ["cli"]

[workspace]
members = [".", "web"]
