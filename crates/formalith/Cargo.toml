[package]
name = "formalith"
description = "Modern computer algebra system focused on flexibility"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "../../README.md"
keywords = ["mathematics", "symbolic", "algebra"]
categories = ["mathematics", "science"]
# The files of `tests/` are modules of the single binary `integration` (see `tests/main.rs`)
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
append-only-vec = "0.1"
dyn-clone = "1"
dyn-eq = "0.1"
dyn-hash = "1"
malachite = { version = "0.9", default-features = false, features = ["naturals_and_integers", "rationals"] }
libm = "0.2"
owo-colors = "4"
# Scopes of the `profile` feature, recorded by the backend a dependent crate enables
profiling = { version = "1.0.18", optional = true, default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
supports-color = "3"

[features]
concise-debug = []
# `Serialize` and `Deserialize` for numerical expressions (`field::real::numeric`)
serde = ["dep:serde"]
# Profiling scopes in the expensive operations (integrals, limits, solving...), through the `profiling` crate
profile = ["dep:profiling"]
