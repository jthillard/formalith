[package]
name = "formalith-gui-worker"
description = "Formalith graphical interface in the browser: the Web Worker evaluating the lines, without the interface"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# Only built for the browser: natively, the interface evaluates in a thread
[target.'cfg(target_arch = "wasm32")'.dependencies]
formalith-gui = { path = "../formalith-gui", default-features = false }
wasm-bindgen = "=0.2.128"
serde_json = "1"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[features]
# Profiling scopes recorded by the worker and sent to the interface
profile = ["formalith-gui/profile"]

# `wasm-opt` (binaryen, downloaded by wasm-pack) for `--profile wasm-release`, with the features rustc emits
[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-reference-types", "--enable-multivalue", "--enable-mutable-globals"]
