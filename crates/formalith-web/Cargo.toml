[package]
name = "formalith-web"
description = "Formalith command line interface running in the browser"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
formalith-session.workspace = true
wasm-bindgen = "=0.2.128"
console_error_panic_hook = "0.1"

# `wasm-opt` (binaryen) is not required to build
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
