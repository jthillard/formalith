[package]
name = "formalith-gui"
description = "Formalith graphical interface: expressions, their results and an interactive plot, natively and in the browser"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "formalith-gui"
path = "src/main.rs"

[dependencies]
formalith-session = { workspace = true, features = ["serde"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui_plot = "0.38"
serde = { version = "1", features = ["derive"] }
profiling = { version = "1.0.18", optional = true, default-features = false }
puffin = { version = "0.20", optional = true }

[features]
# The profiler window: records the interface, the evaluation (down to the CAS) and the GPU with puffin, which also
# records egui, eframe and wgpu through their `profiling` scopes
profile = ["dep:profiling", "dep:puffin", "profiling/profile-with-puffin", "formalith-session/profile"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
serde_json = "1"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "Performance"] }
console_error_panic_hook = "0.1"
# The clock of puffin in the browser
puffin = { version = "0.20", optional = true, features = ["web"] }
# WebGL2 when the browser has no WebGPU
wgpu = { version = "30", default-features = false, features = ["webgl", "webgpu"] }

[dev-dependencies]
serde_json = "1"
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"

# `wasm-opt` (binaryen) is not required to build
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
