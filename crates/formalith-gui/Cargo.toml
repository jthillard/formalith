[package]
name = "formalith-gui"
description = "Formalith graphical interface: expressions, their results and an interactive plot, natively and in the browser"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "formalith-gui"
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
formalith-session = { workspace = true, features = ["serde"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence"], optional = true }
egui_plot = { version = "0.38", optional = true }
serde = { version = "1", features = ["derive"] }
profiling = { version = "1.0.18", optional = true, default-features = false }
puffin = { version = "0.20", optional = true }

[features]
default = ["ui"]
# The interface; without it, only the evaluation of lines (`protocol`), for the Web Worker `formalith-gui-worker`
ui = ["dep:eframe", "dep:egui_plot", "dep:wgpu", "dep:wasm-bindgen-futures", "dep:web-sys"]
# The profiler window: records the interface, the evaluation (down to the CAS) and the GPU with puffin, which also
# records egui, eframe and wgpu through their `profiling` scopes
profile = ["dep:profiling", "dep:puffin", "profiling/profile-with-puffin", "formalith-session/profile"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wayland", "x11"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
serde_json = "1"
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = "0.3"
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "HtmlCanvasElement", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "Performance"] }
console_error_panic_hook = "0.1"
# The clock of puffin in the browser
puffin = { version = "0.20", optional = true, features = ["web"] }
# WebGL2 when the browser has no WebGPU
wgpu = { version = "30", default-features = false, features = ["webgl", "webgpu"], optional = true }

[dev-dependencies]
serde_json = "1"
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"

# `wasm-opt` (binaryen, downloaded by wasm-pack) for `--profile wasm-release`, with the features rustc emits
[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-reference-types", "--enable-multivalue", "--enable-mutable-globals"]
