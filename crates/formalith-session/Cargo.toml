[package]
name = "formalith-session"
description = "Formalith interactive sessions: commands, definitions and results shared by its interfaces"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
keywords = ["mathematics", "symbolic", "algebra", "repl"]
categories = ["mathematics", "science"]

[dependencies]
formalith.workspace = true
serde = { version = "1", features = ["derive"], optional = true }

[features]
# `Serialize` and `Deserialize` for graphs
serde = ["dep:serde", "formalith/serde"]
