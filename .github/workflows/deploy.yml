name: Deploy

# Builds the REPL and the GUI for the web once CI passes on main, and copies them to the VPS.
# Repository secrets:
# - VPS_HOST, VPS_USER: where to connect with SSH
# - VPS_SSH_KEY: private key of a deploy key authorized for VPS_USER
# - VPS_KNOWN_HOSTS: the host's line(s), from `ssh-keyscan <host>`
# - VPS_PATH: directory receiving `repl/` and `gui/`
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: rustup show
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: sudo apt-get install -y brotli
      - run: ./dev web --release && ./dev gui-web --release
      # gzip and brotli copies for nginx's gzip_static / brotli_static
      - run: |
          find crates/formalith-web/www crates/formalith-gui/www -type f \
            \( -name '*.wasm' -o -name '*.js' -o -name '*.html' -o -name '*.css' \) \
            -exec gzip -9knf {} \; -exec brotli -kf {} \;
      - name: Copy to the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          sync() { rsync -rlcz --delete --delay-updates --exclude package.json --exclude .gitignore -e "ssh -i ~/.ssh/id_deploy" "$@"; }
          sync crates/formalith-web/www/ "$TARGET/repl/"
          sync crates/formalith-gui/www/ "$TARGET/gui/"
