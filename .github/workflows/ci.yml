name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The nightly of last Monday rather than that of `rust-toolchain.toml` (`RUSTUP_TOOLCHAIN` overrides it), so the
      # cache keyed by the rustc version is rebuilt once a week instead of every day
      - run: echo "RUSTUP_TOOLCHAIN=nightly-$(date -d 'last monday' +%F)" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The nightly of last Monday rather than that of `rust-toolchain.toml` (`RUSTUP_TOOLCHAIN` overrides it), so the
      # cache keyed by the rustc version is rebuilt once a week instead of every day
      - run: echo "RUSTUP_TOOLCHAIN=nightly-$(date -d 'last monday' +%F)" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      # rust-cache's key ignores `[profile]`: without this, a profile change restores stale dependencies that are rebuilt
      # every run and never saved again (the key still matches)
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml', '.cargo/config.toml') }}
      # Builds every test binary and example once, so the next step only runs them
      - run: cargo test --workspace --no-run
      - run: cargo test --workspace
