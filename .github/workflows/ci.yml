name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      # Before any build, so a formatting error fails fast
      - run: cargo fmt --all --check
      # Same key as `test`, see there (rust-cache adds the job id, so the two caches stay separate)
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml', '.cargo/config.toml') }}
      # `-D warnings` after `--` rather than in `RUSTFLAGS`, which would change the fingerprint of every dependency.
      # `--workspace` includes the non-default members (GUI, web REPL, worker)
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      # rust-cache's key ignores `[profile]`: without this, a profile change restores stale dependencies that are rebuilt
      # every run and never saved again (the key still matches)
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml', '.cargo/config.toml') }}
      # Builds every test binary and example once, so the next step only runs them
      - run: cargo test --workspace --locked --no-run
      - run: cargo test --workspace --locked
