[package]
name = "formalith-web"
description = "Formalith command line interface running in the browser"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/supersurviveur/formalith"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
formalith = { path = "..", default-features = false }
wasm-bindgen = "=0.2.128"
console_error_panic_hook = "0.1"

# `wasm-opt` (binaryen) is not required to build
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
